name: DAST (nightly)

on:
  schedule:
    - cron: '0 3 * * *'   # 3am UTC daily
  workflow_dispatch: {}

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'https://mifrahzia.com'
          fail_action: true
