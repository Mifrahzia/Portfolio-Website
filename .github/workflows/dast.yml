name: DAST (nightly)

on:
  schedule:
    - cron: '0 3 * * *'   # 3am UTC daily
  workflow_dispatch: {}

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'https://mifrahzia.com'
          rules_file_name: '.zap/rules.tsv'
          fail_action: true
